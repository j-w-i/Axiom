include: package:flutter_lints/flutter.yaml
analyzer:
  language: { strict-casts: true, strict-raw-types: true, strict-inference: true }
  exclude: [build/**, windows/**, macos/**, linux/**]
formatter:
  page_width: 100
linter:
  rules: [unawaited_futures, always_declare_return_types, prefer_final_locals, cancel_subscriptions, close_sinks]
