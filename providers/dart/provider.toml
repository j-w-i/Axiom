schema = "axiom.provider/1"
id = "dart"
name = "Dart"
description = "The Dart SDK (BSD-3-Clause), with the Dart analysis server."
version = "0.1.0"
homepage = "https://dart.dev"

[project]
any_file = ["pubspec.yaml"]

[[tools]]
id = "dart"
program = "dart"
version_regex = 'version: (\d+\.\d+\.\d+)'

[[install]]
kind = "archive"
versions = { kind = "static", versions = ["3.14.1"] }
bin_dirs = ["bin"]

[[install.artifacts]]
platform = { os = "linux", arch = "x86_64" }
url = "https://storage.googleapis.com/dart-archive/channels/stable/release/${version}/sdk/dartsdk-linux-x64-release.zip"
format = "zip"
strip_components = 1
checksum = { kind = "sha256", values = { "3.14.1" = "759bed01e0aeb50e1a0b0a19474ba5c80c6087ce1d37b3214e475c81a44430e8" } }

[[install.artifacts]]
platform = { os = "linux", arch = "aarch64" }
url = "https://storage.googleapis.com/dart-archive/channels/stable/release/${version}/sdk/dartsdk-linux-arm64-release.zip"
format = "zip"
strip_components = 1
checksum = { kind = "sha256", values = { "3.14.1" = "c6e5581d478ac43ecf7d7028798b1bd10aef509f5e351184c755ec7eeeb1bea9" } }

[[install.artifacts]]
platform = { os = "macos", arch = "x86_64" }
url = "https://storage.googleapis.com/dart-archive/channels/stable/release/${version}/sdk/dartsdk-macos-x64-release.zip"
format = "zip"
strip_components = 1
checksum = { kind = "sha256", values = { "3.14.1" = "3d440c968d4c1bb21c6d57eb1e3e364cea687899daef46b7cc99f07d328caaae" } }

[[install.artifacts]]
platform = { os = "macos", arch = "aarch64" }
url = "https://storage.googleapis.com/dart-archive/channels/stable/release/${version}/sdk/dartsdk-macos-arm64-release.zip"
format = "zip"
strip_components = 1
checksum = { kind = "sha256", values = { "3.14.1" = "b670699f921bf307c3f2754b56349863ee9b2878661bcd446b50b90296e11311" } }

[[tasks]]
id = "test"
kind = "test"
label = "dart test"
command = ["dart", "test"]
