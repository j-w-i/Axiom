schema = "axiom.provider/1"
id = "lsp-sourcekit"
name = "SourceKit-LSP"
description = "Swift language server, part of the Swift toolchain (Apache-2.0); install Swift (or Xcode) to get it."
version = "0.1.0"
homepage = "https://github.com/swiftlang/sourcekit-lsp"

[[tools]]
id = "sourcekit-lsp"
program = "sourcekit-lsp"
version_regex = '(\d+\.\d+(?:\.\d+)?)'
required = false

[[lsp]]
id = "sourcekit-lsp"
languages = ["swift"]
command = ["sourcekit-lsp"]
install_hint = "SourceKit-LSP comes with Swift: install a Swift toolchain (swift.org) or Xcode."
