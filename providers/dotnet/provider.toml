schema = "axiom.provider/1"
id = "dotnet"
name = ".NET"
description = "The .NET SDK (MIT): detected on this computer, or installed by Axiom (.NET 11, verified by Microsoft's SHA-512)."
version = "0.1.0"
homepage = "https://dotnet.microsoft.com"

[project]
any_file = ["*.csproj", "*.fsproj", "*.sln", "*.slnx", "global.json"]

[[tools]]
id = "dotnet"
program = "dotnet"
version_regex = '(\d+\.\d+\.\d+)'

# Microsoft publishes SHA-512 digests only (the release metadata, release-metadata/11.0/releases.json).
# DOTNET_ROOT: a .NET tool's launcher (csharp-ls) finds the runtime there, not on PATH.
[[install]]
kind = "archive"
versions = { kind = "static", versions = ["11.0.100"] }
bin_dirs = ["."]
env = { DOTNET_ROOT = "${root}", DOTNET_CLI_TELEMETRY_OPTOUT = "1", DOTNET_NOLOGO = "1" }

[[install.artifacts]]
platform = { os = "linux", arch = "aarch64" }
url = "https://builds.dotnet.microsoft.com/dotnet/Sdk/${version}/dotnet-sdk-${version}-linux-arm64.tar.gz"
format = "tar.gz"
checksum = { kind = "sha512", values = { "11.0.100" = "cfa248bb1377606e868602fb5b4d66fa16b7546156593937d1982f7f2142e6ded76d71c4a26efdab99f87c46ab40c3c672ab1b57ef7fa25449efe5b140a55af4" } }

[[install.artifacts]]
platform = { os = "linux", arch = "x86_64" }
url = "https://builds.dotnet.microsoft.com/dotnet/Sdk/${version}/dotnet-sdk-${version}-linux-x64.tar.gz"
format = "tar.gz"
checksum = { kind = "sha512", values = { "11.0.100" = "1bec9cca2ec689b1e80245b84f2b53c9441d1aa6daccf2ceb27490768bffa95954fa585bd275def31069d874d543d9ba9e6591fe9ade2dbd9f34ec5c0fd0050c" } }

[[install.artifacts]]
platform = { os = "macos", arch = "aarch64" }
url = "https://builds.dotnet.microsoft.com/dotnet/Sdk/${version}/dotnet-sdk-${version}-osx-arm64.tar.gz"
format = "tar.gz"
checksum = { kind = "sha512", values = { "11.0.100" = "6c8978e0a8f24a04b69a539fe29edf0c68e3247e46e24afb4920ee479e2ce1256b17fdf0626f8835b9c743784c08b40ecb25abdd8dd49fc99d040daf1ddb4de2" } }

[[install.artifacts]]
platform = { os = "macos", arch = "x86_64" }
url = "https://builds.dotnet.microsoft.com/dotnet/Sdk/${version}/dotnet-sdk-${version}-osx-x64.tar.gz"
format = "tar.gz"
checksum = { kind = "sha512", values = { "11.0.100" = "8e9c8835c4d1ed8e3045f1a00e5831b028fb090161d1acbeb6e8b26882cb783ff18ab04f478134bf51b538f2becbbf999737c18f17c568ef37fb94a91a03d6a5" } }

[[tasks]]
id = "build"
kind = "build"
label = "dotnet build"
command = ["dotnet", "build"]

[[tasks]]
id = "test"
kind = "test"
label = "dotnet test"
command = ["dotnet", "test"]
