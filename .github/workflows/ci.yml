name: CI
on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # `axiom-desktop-tauri` is excluded: tauri::generate_context! embeds the
      # built frontend, so the shell only compiles after `pnpm run build`. Its
      # clippy and tests run in the `tauri` job, together with that bundle.
      - run: cargo clippy --workspace --all-targets --exclude axiom-desktop-tauri -- -D warnings
      # crates/desktop-bridge's tests spawn the real daemon binary.
      - run: cargo build -p axiomd
      - run: cargo test --workspace --exclude axiom-desktop-tauri
      - run: cargo run -q -p axiom-protocol --example export_schema -- --check
      - run: python3 scripts/tasks.py check
      - run: python3 scripts/check_deps.py

  tauri:
    name: Tauri shell (${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Every `run` step starts here unless it sets its own directory.
        # Paths in `run` are relative to it; paths in `uses:` steps (artifact
        # upload) are relative to the workspace root.
        working-directory: apps/desktop-tauri
    env:
      # The Vitest store tests and the end-to-end suites spawn the real daemon.
      AXIOMD_UNDER_TEST: ${{ github.workspace }}/target/release/axiomd${{ matrix.os == 'windows-latest' && '.exe' || '' }}
      # Where the end-to-end suites put screenshots and the app's own log.
      AXIOM_SCREENSHOT_DIR: ${{ github.workspace }}/e2e-artifacts/screenshots
      AXIOM_E2E_LOG: ${{ github.workspace }}/e2e-artifacts/app.log
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/desktop-tauri/pnpm-lock.yaml }

      # Linux: WebKitGTK 4.1 / GTK 3 (Tauri's documented prerequisites), Xvfb
      # for the private display the end-to-end runner starts, and
      # WebKitWebDriver for the trusted-input run (its package was renamed
      # webkitgtk-webdriver in Ubuntu 25.10).
      # Windows: WebView2 is preinstalled. macOS: WebKit is part of the OS.
      # Windows and macOS need no WebDriver binary: the e2e build embeds one.
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev xvfb
          sudo apt-get install -y --no-install-recommends webkitgtk-webdriver \
            || sudo apt-get install -y --no-install-recommends webkit2gtk-driver
          command -v WebKitWebDriver
      - name: tauri-driver (Linux trusted-input run)
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --version '=2.1.0' --locked

      # ---- build and unit level ------------------------------------------------
      - run: cargo build --release -p axiomd
      - run: pnpm install --frozen-lockfile
      # The shell compiles editor/src directly (ADR-0012 §4); tsc resolves
      # monaco-editor's types relative to that file, so editor/ needs its deps.
      - name: Editor package dependencies
        working-directory: editor
        run: pnpm install --frozen-lockfile
      - run: pnpm run check          # tsc --noEmit
      - run: pnpm run build          # vite build: the bundle the app embeds
      - run: pnpm run test           # Vitest: stores against the real axiomd, tokens, process lookup
      # The host only compiles once dist/ exists (tauri::generate_context!).
      - run: cargo clippy -p axiom-desktop-tauri --all-targets -- -D warnings
      - run: cargo clippy -p axiom-desktop-tauri --all-targets --features e2e -- -D warnings
      - run: cargo test -p axiom-desktop-tauri   # includes release_guard.rs

      # ---- end-to-end: the real app, webview, daemon and input on every OS -----
      # Built with the `e2e` feature (embedded WebDriver server on 127.0.0.1).
      # This binary is overwritten by the package build below, which then
      # proves the shipped one does not contain the server.
      # Linux runs the suites twice: WebKitWebDriver (trusted key events) and
      # the embedded server Windows and macOS use, so that path is proven on a
      # platform where it can be compared with the trusted one.
      - run: cargo build --release -p axiom-desktop-tauri --features e2e
      # Step name records the driver per OS (T-09 req. 2).
      - name: End-to-end (${{ matrix.os == 'ubuntu-latest' && 'WebKitWebDriver + embedded' || 'embedded WebDriver' }})
        shell: bash
        run: scripts/e2e.sh --no-build --driver all

      # ---- packages ---------------------------------------------------------------
      - name: Package
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   bundles=deb,rpm ;;
            Windows) bundles=nsis ;;
            macOS)   bundles=app ;;
            *) echo "unknown runner OS $RUNNER_OS" >&2; exit 1 ;;
          esac
          scripts/bundle.sh --bundles "$bundles"
      # macOS: the bundle cannot be launched on the runner headlessly, but its
      # structure decides whether locate_daemon finds the sidecar on a user's Mac.
      - name: Verify the macOS bundle's structure
        if: runner.os == 'macOS'
        shell: bash
        run: scripts/verify-package.sh --app "$(ls -d ../../target/release/bundle/macos/*.app)"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/nsis/*.exe
            target/release/bundle/macos/*.app
          if-no-files-found: error

      - name: Upload end-to-end screenshots and app log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.os }}
          path: e2e-artifacts/
          if-no-files-found: ignore

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-deny }
      - run: cargo deny check

  editor:
    name: Editor (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: editor/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
      - run: pnpm run test

  desktop:
    name: Desktop (${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      # Windows uses 6.11.3: for 6.12.0 its qtwebengine extension package was built months
      # before the base packages and fails to load (0xC0000139, missing entry point).
      # For 6.11.3 both were built the same day. Linux and macOS use 6.12.0.
      QT_VERSION: ${{ matrix.os == 'windows-latest' && '6.11.3' || '6.12.0' }}
    steps:
      - uses: actions/checkout@v4

      # ---- toolchains
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: editor/pnpm-lock.yaml }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      # ---- Qt with WebEngine (LGPL modules only, ADR-0011)
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.os == 'windows-latest' && 'win64_msvc2022_64' || '' }}
          modules: qtwebengine qtwebchannel qtwebsockets qtpositioning
          cache: true
          # The released aqtinstall (3.3.0) cannot read the Windows 6.12.0 repository layout
          # (qt6_6120_msvc2022_64) and fails with "Failed to locate XML data". The master
          # branch can, and installs qtwebengine from the separate extensions repository.
          # Pin to a released version once one contains the fix (see docs/roadmap/current.md).
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@master"

      # Tests load Qt DLLs from PATH; another Qt6Core earlier on PATH gives
      # 0xC0000139 (entry point not found) at process start. Put our Qt first.
      - name: Windows - Qt DLLs first on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Qt root: $env:QT_ROOT_DIR"
          "$env:QT_ROOT_DIR\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "QT_MODULE_DLL=$env:QT_ROOT_DIR\bin\Qt6Core.dll" | Out-File -FilePath $env:GITHUB_ENV -Append

      # install-qt-action already installs Qt's own Linux dependencies. This adds only the
      # runtime libraries Qt does not list, and must never sink the job when a mirror is
      # unreachable: a genuinely missing library then fails loudly in ctest instead.
      - name: Linux runtime libraries (best effort)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=1 -o Acquire::http::Timeout=10 \
            libnss3 libnspr4 libasound2t64 libxcb-cursor0 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-icccm4 libxcb-xinerama0 \
            libxkbcommon-x11-0 libfontconfig1

      - name: Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y
      - name: MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # ---- build the daemon, the test helper and the editor bundle
      - run: cargo build -p axiomd -p emit
      - name: Editor bundle
        working-directory: editor
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # ---- the QML literal guard, then the app
      - run: python3 scripts/check_qml.py
      - name: Configure
        shell: bash
        run: cmake -S apps/desktop -B build/desktop -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build/desktop

      # ---- smoke tests, offscreen. Chromium's sandbox cannot start inside the Linux CI
      # container (no user namespaces / setuid helper), so it is disabled on Linux CI ONLY.
      # The application itself never sets this; developers' runs keep the sandbox.
      # Windows only: pin down where a test executable stops. Each function runs on its own
      # with a 15 s cap, writing QtTest's log to a file (stdout is lost when a process is
      # killed). Never fails the job.
      # Windows: deploy Qt next to the executables (windeployqt) and the newest MSVC runtime
      # from the Visual Studio redist. Loading Qt6WebEngine*.dll only through PATH fails here
      # with 0xC0000139 (missing entry point), because the runner's System32 runtime is older
      # than the one Qt's binaries and our build need.
      - name: Windows - deploy Qt and the VC runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-translations --no-opengl-sw --qmldir apps/desktop/qml build/desktop/axiom.exe
          if ($LASTEXITCODE -ne 0) { Write-Host "windeployqt exit=$LASTEXITCODE" }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $vs = & $vswhere -latest -property installationPath
            $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT" -Directory -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
            if ($crt) {
              Write-Host "VC runtime: $($crt.FullName)"
              Copy-Item "$($crt.FullName)\*.dll" build/desktop/ -Force
              Copy-Item "$($crt.FullName)\*.dll" target/debug/ -Force
            }
          }
          Get-ChildItem build/desktop/*.dll | Select-Object -First 5 Name

      - name: Windows single-function diagnostics
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        env:
          AXIOMD_UNDER_TEST: ${{ github.workspace }}/target/debug/axiomd.exe
          AXIOM_EMIT: ${{ github.workspace }}/target/debug/emit.exe
          AXIOM_EDITOR_ASSETS: ${{ github.workspace }}/build/editor
          AXIOM_SCREENSHOT_DIR: ${{ github.workspace }}/build/screenshots
        run: |
          $log = "$env:RUNNER_TEMP/q.log"
          foreach ($f in @('initTestCase', 'initializeSucceeds')) {
            Remove-Item $log -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath 'build/desktop/tst_daemonclient.exe' -ArgumentList @($f, '-o', "$log,txt") -PassThru -NoNewWindow
            if (-not $p.WaitForExit(25000)) { Write-Host "FUNCTION $f HUNG"; try { $p.Kill() } catch {} } else { Write-Host "FUNCTION $f exit=$($p.ExitCode)" }
            Get-Content $log -ErrorAction SilentlyContinue | Select-Object -Last 12
          }

      - name: Test (Linux)
        if: runner.os == 'Linux'
        env:
          QTWEBENGINE_DISABLE_SANDBOX: "1"
          AXIOM_SCREENSHOT_DIR: ${{ github.workspace }}/build/screenshots
        run: ctest --test-dir build/desktop --output-on-failure --stop-on-failure --timeout 45
      - name: Test (macOS, Windows)
        if: runner.os != 'Linux'
        env:
          AXIOM_SCREENSHOT_DIR: ${{ github.workspace }}/build/screenshots
        shell: bash
        run: ctest --test-dir build/desktop --output-on-failure --stop-on-failure --timeout 45

      - name: Upload logs and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            build/desktop/Testing/Temporary/LastTest.log
            build/desktop/*.log
            build/screenshots/
          if-no-files-found: ignore
