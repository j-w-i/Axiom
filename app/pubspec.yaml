name: axiom
description: The Axiom desktop client.
publish_to: none
version: 0.0.1+1
environment:
  sdk: ^3.14.0
dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
flutter:
  shaders:
    - shaders/shade.frag
  fonts:
    - family: Inter
      fonts: [{ asset: fonts/Inter.ttf }]
    - family: JetBrains Mono
      fonts: [{ asset: fonts/JetBrainsMono.ttf }]
