[package]
name = "axiom-spawn"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# As the workspace's, except that unsafe code may be allowed where the system can only be asked so.
[lints.rust]
unsafe_code = "deny"
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"

[dependencies]
axiom-policy.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
