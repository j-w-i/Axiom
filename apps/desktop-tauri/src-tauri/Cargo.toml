[package]
name = "axiom-desktop-tauri"
description = "Axiom desktop shell: Tauri 2 host for the React UI (ADR-0012)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "axiom_desktop_tauri_lib"
crate-type = ["rlib"]

[[bin]]
name = "axiom-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
axiom-desktop-bridge = { path = "../../../crates/desktop-bridge" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
# End-to-end tests only (feature `e2e`, never in a release): a W3C WebDriver
# server embedded in the app, bound to 127.0.0.1, which lets WebdriverIO drive
# the real webview on Linux, Windows *and* macOS. It defines no IPC commands, so
# the page's capability is unchanged. `tests/release_guard.rs` fails if a
# default build ever depends on it.
tauri-plugin-wdio-webdriver = { version = "=2.0.0-next.0", optional = true }

[dev-dependencies]
# tests/release_guard.rs parses this manifest (same version crates/protocol uses).
toml = "1.2.1"

# Linux only: the engine's real "content process died" signal (T-08). Same crate
# and feature set Tauri itself links, so the types unify; nothing else uses it.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", features = ["v2_40"] }

[features]
# Serve the bundled frontend (dist/) instead of the dev server. The Tauri CLI
# turns this on for `tauri build`; it is a default so plain `cargo build
# --release` (used by the benchmarks and e2e scripts) produces a real app.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Builds the app the end-to-end suite drives: the release build plus an
# embedded WebDriver server. Never enabled by `scripts/bundle.sh`, so it can
# never reach a package.
e2e = ["dep:tauri-plugin-wdio-webdriver"]

[lints]
workspace = true
