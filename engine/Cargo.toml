[workspace]
members = ["crates/proto", "crates/journal", "crates/host", "crates/cli"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
axiom-proto = { path = "crates/proto" }
axiom-journal = { path = "crates/journal" }
axiom-host = { path = "crates/host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util", "macros", "signal", "fs"] }
rusqlite = { version = "0.43", features = ["bundled"] }
getrandom = "0.4"
proptest = { version = "1", default-features = false, features = ["std"] }
tempfile = "3"
uds_windows = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
