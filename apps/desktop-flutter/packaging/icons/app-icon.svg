<!-- Axiom app icon source (1024 px): brass mark (brass-500 #c9a35b) on a graphite plate
     (graphite-350-ish #2a2b2f to graphite-150-ish #151618) with a 9% white lit edge.
     Regenerate the set: render to app-icon.png (1024x1024, transparent), then
     `pnpm tauri icon src-tauri/icons/source/app-icon.png` in apps/desktop-tauri. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2b2f"/>
      <stop offset="1" stop-color="#151618"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#plate)"/>
  <rect x="33" y="33" width="446" height="446" rx="99" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2"/>
  <g transform="translate(112 112) scale(18)" fill="none" stroke="#c9a35b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="3" r="1.5"/>
    <path d="M7.3 4.35L3.25 14M8.7 4.35l4.05 9.65"/>
    <path d="M4.6 10.75Q8 12.4 11.4 10.75"/>
  </g>
</svg>
