# Built-in provider: Ninja (M2-PROV-002; contract: docs/protocols/providers.md).
# Ninja's GitHub releases publish no checksum file, so the digests below are pinned per
# version, copied from the SHA-256 digests GitHub publishes for each release asset
# (`gh api repos/ninja-build/ninja/releases/tags/v<version>`). Only versions with published
# digests are offered. Each archive holds the single `ninja` executable at its root.
schema = "axiom.provider/1"
id = "ninja"
name = "Ninja"
description = "The Ninja build system, used by CMake's Ninja generator."
version = "0.1.0"
homepage = "https://ninja-build.org"

[project]
any_file = ["CMakeLists.txt", "build.ninja"]

[[tools]]
id = "ninja"
program = "ninja"
version_regex = '^(\d+\.\d+\.\d+)'

[[install]]
kind = "archive"
versions = { kind = "static", versions = ["1.13.2", "1.13.1"] }
bin_dirs = ["."]

[[install.artifacts]]
platform = { os = "linux", arch = "x86_64" }
url = "https://github.com/ninja-build/ninja/releases/download/v${version}/ninja-linux.zip"
format = "zip"
checksum = { kind = "sha256", values = { "1.13.2" = "5749cbc4e668273514150a80e387a957f933c6ed3f5f11e03fb30955e2bbead6", "1.13.1" = "0830252db77884957a1a4b87b05a1e2d9b5f658b8367f82999a941884cbe0238" } }

[[install.artifacts]]
platform = { os = "linux", arch = "aarch64" }
url = "https://github.com/ninja-build/ninja/releases/download/v${version}/ninja-linux-aarch64.zip"
format = "zip"
checksum = { kind = "sha256", values = { "1.13.2" = "fd2cacc8050a7f12a16a2e48f9e06fca5c14fc4c2bee2babb67b58be17a607fc", "1.13.1" = "740f1b9f9d8ae68438240a6a2f3f7a27fc8b1946d2024a6a6b25857ee877987b" } }

[[install.artifacts]]
platform = { os = "macos" }
url = "https://github.com/ninja-build/ninja/releases/download/v${version}/ninja-mac.zip"
format = "zip"
checksum = { kind = "sha256", values = { "1.13.2" = "c99048673aa765960a99cf10c6ddb9f1fad506099ff0a0e137ad8960a88f321b", "1.13.1" = "da7797794153629aca5570ef7c813342d0be214ba84632af886856e8f0063dd9" } }

[[install.artifacts]]
platform = { os = "windows", arch = "x86_64" }
url = "https://github.com/ninja-build/ninja/releases/download/v${version}/ninja-win.zip"
format = "zip"
checksum = { kind = "sha256", values = { "1.13.2" = "07fc8261b42b20e71d1720b39068c2e14ffcee6396b76fb7a795fb460b78dc65", "1.13.1" = "26a40fa8595694dec2fad4911e62d29e10525d2133c9a4230b66397774ae25bf" } }

[[install.artifacts]]
platform = { os = "windows", arch = "aarch64" }
url = "https://github.com/ninja-build/ninja/releases/download/v${version}/ninja-winarm64.zip"
format = "zip"
checksum = { kind = "sha256", values = { "1.13.2" = "e52f0bdef9dfb1003229dbd6508a508c4073fd017247002adc66e5e806cb0391", "1.13.1" = "fb959b674970e36a7c9a23191524b80fb5298fc71fc98bfa42456bcc0a8dfb2f" } }
