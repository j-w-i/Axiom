[package]
name = "axiom-desktop-bridge"
description = "Protocol 0.1 client for a GUI host: spawns and supervises axiomd over its stdio. No GUI dependency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
axiom-protocol = { path = "../protocol" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The tests drive the bridge on a multi-thread runtime (as the Tauri host does).
tokio = { version = "1", features = ["rt-multi-thread"] }

[lints]
workspace = true
