name: CI
on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy, rust-analyzer" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # `axiom-desktop-tauri` is excluded: tauri::generate_context! embeds the
      # built frontend, so the shell only compiles after `pnpm run build`. Its
      # clippy and tests run in the `tauri` job, together with that bundle.
      - run: cargo clippy --workspace --all-targets --exclude axiom-desktop-tauri -- -D warnings
      # crates/desktop-bridge's tests spawn the real daemon binary.
      - run: cargo build -p axiomd
      # M4-LSP-001: the real rust-analyzer test must run (not skip) on Linux and macOS.
      - run: cargo test --workspace --exclude axiom-desktop-tauri
        env:
          AXIOM_REQUIRE_LSP: ${{ runner.os != 'Windows' && '1' || '' }}
      # M2-ENV-003: a real managed Rust install (rustup-init + a minimal toolchain) into a
      # temp data dir with a temp HOME, then uninstall. Needs the internet.
      # On Linux it also installs the `tree` package with apt through a pkexec shim
      # (M2-ENV-004); the runner's passwordless sudo stands in for the polkit prompt.
      # One thread: the Rust test points HOME at a temp dir for the whole process.
      - run: cargo test -p axiom-env --features ci-install --test ci_install -- --nocapture --test-threads=1
        env:
          AXIOM_CI_SYSTEM_INSTALL: ${{ runner.os == 'Linux' && '1' || '' }}
      - run: cargo run -q -p axiom-protocol --example export_schema -- --check
      - run: python3 scripts/tasks.py check
      - run: python3 scripts/check_deps.py

  tauri:
    name: Tauri shell (${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Every `run` step starts here unless it sets its own directory.
        # Paths in `run` are relative to it; paths in `uses:` steps (artifact
        # upload) are relative to the workspace root.
        working-directory: apps/desktop-tauri
    env:
      # The Vitest store tests and the end-to-end suites spawn the real daemon.
      AXIOMD_UNDER_TEST: ${{ github.workspace }}/target/release/axiomd${{ matrix.os == 'windows-latest' && '.exe' || '' }}
      # Where the end-to-end suites put screenshots and the app's own log.
      AXIOM_SCREENSHOT_DIR: ${{ github.workspace }}/e2e-artifacts/screenshots
      AXIOM_E2E_LOG: ${{ github.workspace }}/e2e-artifacts/app.log
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/desktop-tauri/pnpm-lock.yaml }

      # Linux: WebKitGTK 4.1 / GTK 3 (Tauri's documented prerequisites), Xvfb
      # for the private display the end-to-end runner starts, and
      # WebKitWebDriver for the trusted-input run (its package was renamed
      # webkitgtk-webdriver in Ubuntu 25.10).
      # Windows: WebView2 is preinstalled. macOS: WebKit is part of the OS.
      # Windows and macOS need no WebDriver binary: the e2e build embeds one.
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev xvfb
          sudo apt-get install -y --no-install-recommends webkitgtk-webdriver \
            || sudo apt-get install -y --no-install-recommends webkit2gtk-driver
          command -v WebKitWebDriver
      - name: tauri-driver (Linux trusted-input run)
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --version '=2.1.0' --locked

      # ---- build and unit level ------------------------------------------------
      - run: cargo build --release -p axiomd
      - run: pnpm install --frozen-lockfile
      # The shell compiles editor/src directly (ADR-0012 §4); tsc resolves
      # monaco-editor's types relative to that file, so editor/ needs its deps.
      - name: Editor package dependencies
        working-directory: editor
        run: pnpm install --frozen-lockfile
      - run: pnpm run check          # tsc --noEmit
      - run: pnpm run build          # vite build: the bundle the app embeds
      - run: pnpm run test           # Vitest: stores against the real axiomd, tokens, process lookup
      # The host only compiles once dist/ exists (tauri::generate_context!).
      - run: cargo clippy -p axiom-desktop-tauri --all-targets -- -D warnings
      - run: cargo clippy -p axiom-desktop-tauri --all-targets --features e2e -- -D warnings
      - run: cargo test -p axiom-desktop-tauri   # includes release_guard.rs

      # ---- end-to-end: the real app, webview, daemon and input on every OS -----
      # Built with the `e2e` feature (embedded WebDriver server on 127.0.0.1).
      # This binary is overwritten by the package build below, which then
      # proves the shipped one does not contain the server.
      # Linux runs the suites twice: WebKitWebDriver (trusted key events) and
      # the embedded server Windows and macOS use, so that path is proven on a
      # platform where it can be compared with the trusted one.
      - run: cargo build --release -p axiom-desktop-tauri --features e2e
      # Step name records the driver per OS (T-09 req. 2).
      - name: End-to-end (${{ matrix.os == 'ubuntu-latest' && 'WebKitWebDriver + embedded' || 'embedded WebDriver' }})
        shell: bash
        run: scripts/e2e.sh --no-build --driver all
      # The M2 exit scenario (M2-QA-001): a Cargo project with no Rust on the app's PATH and an
      # empty HOME; install a managed Rust through the UI, build, Problems → source, remove.
      # Needs the internet (static.rust-lang.org). Linux: the WebKitWebDriver path.
      - name: End-to-end, M2 exit scenario (env.mjs)
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/e2e.sh --no-build --driver external e2e/env.mjs
      # The M3 exit scenario (M3-QA-001): Chat with no folder by keyboard against a fake
      # OpenAI-compatible server; "add a function and fix the build" through tools with the
      # scripted model and real cargo, checkpoints, a denied command, resume after a restart; an
      # MCP server's tools and an ACP agent (tests/helpers). Both Linux drivers.
      # M4-TERM-002: the integrated terminal (a shell in a PTY). Linux and macOS; Windows (ConPTY)
      # is deferred with the rest of Windows.
      - name: End-to-end, terminal (terminal.mjs)
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/e2e.sh --no-build --driver all e2e/terminal.mjs
      # M4-GIT-002: Git in the UI on a temporary repository. Linux and macOS.
      - name: End-to-end, Git (git.mjs)
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/e2e.sh --no-build --driver all e2e/git.mjs
      # M4-UX-001: workspace search and quick open. Linux and macOS.
      - name: End-to-end, search (search.mjs)
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/e2e.sh --no-build --driver all e2e/search.mjs
      # M4-UX-002: the split editor. Linux and macOS.
      - name: End-to-end, split editor (split.mjs)
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/e2e.sh --no-build --driver all e2e/split.mjs
      # M4-LSP-002: language servers in the editor. fake-lsp always; the real rust-analyzer and
      # typescript-language-server must run here (AXIOM_REQUIRE_LSP=1 fails their absence).
      - name: Language servers for the end-to-end run (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          rustup component add rust-analyzer
          npm install -g typescript-language-server@6.0.0 typescript@6.0.3
      - name: End-to-end, language servers (lsp.mjs)
        if: runner.os == 'Linux'
        shell: bash
        env:
          AXIOM_REQUIRE_LSP: "1"
        run: scripts/e2e.sh --no-build --driver all e2e/lsp.mjs
      # The M4 exit scenario (M4-QA-001): both real language servers, the terminal and Git in one
      # session on one workspace.
      - name: End-to-end, M4 exit scenario (editor.mjs)
        if: runner.os == 'Linux'
        shell: bash
        env:
          AXIOM_REQUIRE_LSP: "1"
        run: scripts/e2e.sh --no-build --driver all e2e/editor.mjs
      - name: End-to-end, M3 exit scenario (agent.mjs)
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/e2e.sh --no-build --driver all e2e/agent.mjs

      # ---- packages ---------------------------------------------------------------
      - name: Package
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   bundles=deb,rpm ;;
            Windows) bundles=nsis ;;
            macOS)   bundles=app ;;
            *) echo "unknown runner OS $RUNNER_OS" >&2; exit 1 ;;
          esac
          scripts/bundle.sh --bundles "$bundles"
      # macOS: the bundle cannot be launched on the runner headlessly, but its
      # structure decides whether locate_daemon finds the sidecar on a user's Mac.
      - name: Verify the macOS bundle's structure
        if: runner.os == 'macOS'
        shell: bash
        run: scripts/verify-package.sh --app "$(ls -d ../../target/release/bundle/macos/*.app)"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/nsis/*.exe
            target/release/bundle/macos/*.app
          if-no-files-found: error

      - name: Upload end-to-end screenshots and app log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.os }}
          path: e2e-artifacts/
          if-no-files-found: ignore

  flutter:
    # The Flutter shell (ADR-0020): analyze, format, tests, licences, and a release build.
    name: Flutter shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.50.1, cache: true }
      - name: Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: scripts/check.sh flutter
      - name: Release build
        working-directory: apps/desktop-flutter
        run: flutter build ${{ runner.os == 'Linux' && 'linux' || 'macos' }} --release

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-deny }
      - run: cargo deny check

  editor:
    name: Editor (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: editor/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
      - run: pnpm run test
