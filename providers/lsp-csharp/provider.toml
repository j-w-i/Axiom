schema = "axiom.provider/1"
id = "lsp-csharp"
name = "csharp-ls"
description = "C# language server (MIT), a .NET tool. Needs the .NET 11 SDK."
version = "0.1.0"
homepage = "https://github.com/razzmatazz/csharp-language-server"

[[tools]]
id = "csharp-ls"
program = "csharp-ls"
version_regex = '(\d+\.\d+\.\d+)'

[[tools]]
id = "dotnet"
program = "dotnet"
version_regex = '(\d+\.\d+\.\d+)'
required = false

[[install]]
kind = "delegate"
using = "dotnet"
scope = "managed"
install = ["dotnet", "tool", "install", "csharp-ls", "--tool-path", "${root}/bin", "--version", "${version}"]
uninstall = []
list_versions = ["dotnet", "tool", "search", "csharp-ls", "--detail"]
versions = { kind = "static", versions = ["0.29.0"] }
bin_dirs = ["bin"]
env = { DOTNET_CLI_TELEMETRY_OPTOUT = "1", DOTNET_NOLOGO = "1" }

[[lsp]]
id = "csharp-ls"
languages = ["csharp"]
command = ["csharp-ls"]
requires = ["dotnet"]
