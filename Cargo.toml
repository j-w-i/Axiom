[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/rpc",
    "crates/store",
    "crates/workspace",
    "crates/exec",
    "crates/env",
    "crates/build",
    "crates/agent",
    "crates/lsp",
    "crates/term",
    "crates/axiomd",
    "crates/desktop-bridge",
    "apps/cli",
    "apps/desktop-tauri/src-tauri",
    "tests/helpers/emit",
    "tests/helpers/fake-mcp",
    "tests/helpers/fake-acp",
    "tests/helpers/fake-lsp",
]
exclude = ["experiments"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "io-util", "macros", "time", "process"] }
tokio-util = "0.7"
tracing = "0.1"
futures-util = "0.3"
rusqlite = { version = "0.41", features = ["bundled"] }
directories = "6"
tempfile = "3"
ignore = "0.4"
sha2 = "0.10"
# M2 (ADR-0014 §3).
toml = "1.2.1"
regex = "1.13"
# rustls with the OS trust store: no native TLS, and no webpki-roots (CDLA licence).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "http2"] }
tar = "0.4"
flate2 = "1"
xz2 = "0.1"
zip = { version = "9", default-features = false, features = ["deflate"] }
hex = "0.4"
# M3 (ADR-0015): unified diffs for fs.applyPatch.
similar = "3"
dunce = "1"
clap = { version = "4", features = ["derive"] }
tracing-subscriber = "0.3"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
nix = { version = "0.30", default-features = false, features = ["signal"] }
windows-sys = "0.61"
# Desktop shell (ADR-0012). Exact pins: the prototype was verified against these.
tauri = "=2.12.5"
tauri-build = "=2.7.4"
tauri-plugin-dialog = "=2.8.4"

[workspace.lints.rust]
unsafe_code = "deny"

# Shipped binaries (axiomd, axiom-tauri). Deliberately no `panic = "abort"`:
# the rpc server catches handler panics to answer `internal` (docs/protocols/ipc.md).
[profile.release]
lto = "thin"
codegen-units = 16
strip = "symbols"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Search's engines are built optimised in dev and test builds too (M4-UX-001): unoptimised
# regex and directory walking are several times slower, so the tests would measure the debug
# build of these crates rather than Axiom's code (the 10 000-file budget took 370 ms on a macOS
# runner and 684 ms on Windows unoptimised). Only these crates; Axiom's own code stays debug.
[profile.dev.package.regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3
[profile.dev.package.aho-corasick]
opt-level = 3
[profile.dev.package.memchr]
opt-level = 3
[profile.dev.package.ignore]
opt-level = 3
[profile.dev.package.globset]
opt-level = 3
