name: CI
on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy, rust-analyzer" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The CLI's tests spawn the real daemon binary.
      - run: cargo build -p axiomd
      # M5-PREVIEW-001: the preview test runs the inspector fixture (React + Vite) in headless
      # Chrome; required on Linux.
      - uses: pnpm/action-setup@v4
        if: runner.os != 'Windows'
        with: { version: 10 }
      - uses: actions/setup-node@v4
        if: runner.os != 'Windows'
        with: { node-version: 22 }
      - name: The inspector fixture's dependencies
        if: runner.os != 'Windows'
        working-directory: tests/fixtures/inspect-react
        run: pnpm install --frozen-lockfile
      # M4-LSP-001: the real rust-analyzer test must run (not skip) on Linux and macOS.
      - run: cargo test --workspace
        env:
          AXIOM_REQUIRE_LSP: ${{ runner.os != 'Windows' && '1' || '' }}
          AXIOM_REQUIRE_PREVIEW: ${{ runner.os == 'Linux' && '1' || '' }}
      # M2-ENV-003: a real managed Rust install (rustup-init + a minimal toolchain) into a
      # temp data dir with a temp HOME, then uninstall. Needs the internet.
      # On Linux it also installs the `tree` package with apt through a pkexec shim
      # (M2-ENV-004); the runner's passwordless sudo stands in for the polkit prompt.
      # One thread: the Rust test points HOME at a temp dir for the whole process.
      - run: cargo test -p axiom-env --features ci-install --test ci_install -- --nocapture --test-threads=1
        env:
          AXIOM_CI_SYSTEM_INSTALL: ${{ runner.os == 'Linux' && '1' || '' }}
      # M5.5-PROV-001: real language server installs (a plain binary, a .gz, an npm package)
      # that answer `initialize`, and a plan for every server provider. Needs the internet.
      - if: runner.os != 'Windows'
        run: cargo test -p axiom-env --features ci-install --test ci_lsp_install -- --nocapture --test-threads=1
      - run: cargo run -q -p axiom-protocol --example export_schema -- --check
      - run: python3 scripts/tasks.py check
      - run: python3 scripts/check_deps.py

  flutter:
    # The Flutter shell (ADR-0020): analyze, format, tests, licences, and a release build.
    name: Flutter shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.50.1, cache: true }
      - name: Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: scripts/check.sh flutter
      - name: Release build
        working-directory: apps/desktop-flutter
        run: flutter build ${{ runner.os == 'Linux' && 'linux' || 'macos' }} --release
      - name: Xvfb for the end-to-end suites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb
      - name: Language servers for the end-to-end run (Linux)
        if: runner.os == 'Linux'
        run: |
          rustup component add rust-analyzer
          npm install -g typescript-language-server@6.0.0 typescript@6.0.3
      # M5-UI-001: the Inspector suite runs the inspector fixture in headless Chrome (the
      # runner's google-chrome).
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - name: The inspector fixture's dependencies
        working-directory: tests/fixtures/inspect-react
        run: pnpm install --frozen-lockfile
      - name: End-to-end (integration_test against the real daemon)
        env:
          AXIOM_E2E_DISPLAY: xvfb
          # Ubuntu: the real servers must run (a missing one fails instead of being skipped).
          AXIOM_REQUIRE_LSP: ${{ runner.os == 'Linux' && '1' || '0' }}
          # Ubuntu: the M2 exit scenario installs a real Rust toolchain (env_rust_test.dart).
          AXIOM_E2E_NETWORK: ${{ runner.os == 'Linux' && '1' || '0' }}
          # Ubuntu: the Inspector suite must run (inspector_test.dart).
          AXIOM_REQUIRE_PREVIEW: ${{ runner.os == 'Linux' && '1' || '' }}
        run: apps/desktop-flutter/scripts/e2e.sh
      - name: Packages (Linux .deb and .rpm, the macOS app bundle) and their verification
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get install -y rpm
            scripts/bundle.sh target/bundle
            scripts/verify-package.sh target/bundle/axiom_*_amd64.deb
            scripts/verify-package.sh "$(find target/bundle -name 'axiom-*.rpm' | head -1)"
          else
            scripts/bundle.sh target/bundle
            scripts/verify-package.sh --app target/bundle/Axiom.app
          fi
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: |
            target/bundle/*.deb
            target/bundle/**/*.rpm
            target/bundle/*.zip
          if-no-files-found: error

  inspectors:
    name: Web inspector (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: inspectors/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: inspectors/web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-deny }
      - run: cargo deny check
