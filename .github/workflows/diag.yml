name: Windows app hang
on:
  push: { branches: [diag/windows-app] }
permissions: { contents: read }
jobs:
  app:
    name: ${{ matrix.file }}
    strategy:
      fail-fast: false
      matrix:
        file: ["test/goldens_test.dart", "test/host/e2e_test.dart", "test/host/fake_host_test.dart", "test/host/proto_test.dart", "test/shell_test.dart", "test/shots_test.dart", "test/transcript/markdown_test.dart", "test/transcript/transcript_view_test.dart", "test/ui/alignment_test.dart", "test/ui/controls_test.dart", "test/ui/execution_test.dart", "test/ui/marks_test.dart", "test/ui/tokens_test.dart"]
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: engine }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.50.0, cache: true }
      - run: cargo build -p axiom-host --locked
        working-directory: engine
      - run: flutter pub get --enforce-lockfile
        working-directory: app
      - name: the tests
        shell: bash
        working-directory: app
        timeout-minutes: 4
        run: flutter test --reporter expanded ${{ matrix.file }}
