name: Windows app hang
on:
  push: { branches: [diag/windows-app] }
permissions: { contents: read }
jobs:
  app:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.50.0, cache: true }
      - run: flutter pub get --enforce-lockfile
        working-directory: app
      - name: start
        shell: pwsh
        working-directory: app
        run: |
          $p = Start-Process cmd.exe -ArgumentList '/c','flutter test --reporter expanded --plain-name "told again" test/host/fake_host_test.dart > ..\out.log 2>&1' -PassThru -WindowStyle Hidden
          "started $($p.Id)"
      - name: wait
        shell: pwsh
        run: Start-Sleep 75; Get-Content out.log
      - uses: actions/upload-artifact@v4
        with: { name: app-out, path: out.log }
      - name: processes
        shell: pwsh
        run: tasklist /fi "imagename eq flutter_tester.exe" /v; tasklist /fi "imagename eq dart.exe" | Out-File tasks.log; Get-Content tasks.log
      - name: stacks
        shell: pwsh
        run: |
          $q = (tasklist /fi "imagename eq flutter_tester.exe" /fo csv | ConvertFrom-Csv)[0].PID
          & "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe" -pv -p $q -c "~*kn 25; qd" > stacks.log
          Get-Content stacks.log -Tail 400
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: app-stacks, path: "*.log" }
