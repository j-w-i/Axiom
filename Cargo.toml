[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/rpc",
    "crates/store",
    "crates/workspace",
    "crates/exec",
    "crates/axiomd",
    "crates/desktop-bridge",
    "apps/desktop-tauri/src-tauri",
    "tests/helpers/emit",
]
exclude = ["experiments"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "io-util", "macros", "time", "process"] }
tokio-util = "0.7"
tracing = "0.1"
futures-util = "0.3"
rusqlite = { version = "0.41", features = ["bundled"] }
directories = "6"
tempfile = "3"
ignore = "0.4"
sha2 = "0.10"
dunce = "1"
clap = { version = "4", features = ["derive"] }
tracing-subscriber = "0.3"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
nix = { version = "0.30", default-features = false, features = ["signal"] }
windows-sys = "0.61"
# Desktop shell (ADR-0012). Exact pins: the prototype was verified against these.
tauri = "=2.12.5"
tauri-build = "=2.7.4"
tauri-plugin-dialog = "=2.8.4"

[workspace.lints.rust]
unsafe_code = "deny"

# Shipped binaries (axiomd, axiom-tauri). Deliberately no `panic = "abort"`:
# the rpc server catches handler panics to answer `internal` (docs/protocols/ipc.md).
[profile.release]
lto = "thin"
codegen-units = 16
strip = "symbols"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
