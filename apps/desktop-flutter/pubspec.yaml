name: axiom_desktop
description: "Axiom desktop shell (Flutter, ADR-0020)"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.14.0

# Widgets layer only: no Material or Cupertino (ADR-0020 §1). Every package here must be MIT,
# BSD or Apache-2.0 (scripts/check_dart_licences.py).
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
