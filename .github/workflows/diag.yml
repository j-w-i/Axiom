name: Windows app hang
on:
  push: { branches: [diag/windows-app] }
permissions: { contents: read }
jobs:
  app:
    name: ${{ matrix.test }}
    strategy:
      fail-fast: false
      matrix:
        test: ["store idle 5", "store resync 1", "store resync 5", "link idle 5"]
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.50.0, cache: true }
      - run: flutter pub get --enforce-lockfile
        working-directory: app
      - name: the test
        shell: bash
        working-directory: app
        timeout-minutes: 3
        run: flutter test --reporter expanded --plain-name "${{ matrix.test }}" test/host/diag_test.dart
