[workspace]
resolver = "2"
members = ["crates/protocol", "crates/rpc", "crates/store", "crates/workspace"]
exclude = ["experiments"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "io-util", "macros", "time"] }
tokio-util = "0.7"
tracing = "0.1"
futures-util = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
directories = "6"
tempfile = "3"
ignore = "0.4"
sha2 = "0.10"
dunce = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
