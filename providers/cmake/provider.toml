# Built-in provider: CMake (M2-PROV-002; contract: docs/protocols/providers.md).
# Official Kitware release archives from GitHub, verified against each release's
# cmake-<version>-SHA-256.txt before extraction. The macOS archive is an app bundle, so its
# programs are under CMake.app/Contents/bin. Builds use the Ninja generator (the `ninja`
# provider installs Ninja); compiler output is parsed as GCC/Clang text.
schema = "axiom.provider/1"
id = "cmake"
name = "CMake"
description = "CMake from Kitware's releases; configure and build with Ninja."
version = "0.1.0"
homepage = "https://cmake.org"

[project]
any_file = ["CMakeLists.txt"]

[[tools]]
id = "cmake"
program = "cmake"
version_regex = 'cmake version (\d+\.\d+\.\d+)'

[[tools]]
id = "ctest"
program = "ctest"
version_regex = 'ctest version (\d+\.\d+\.\d+)'
required = false

[[install]]
kind = "archive"
versions = { kind = "github_releases", repo = "Kitware/CMake", tag_prefix = "v" }
bin_dirs = ["bin", "CMake.app/Contents/bin"]

[[install.artifacts]]
platform = { os = "linux", arch = "x86_64" }
url = "https://github.com/Kitware/CMake/releases/download/v${version}/cmake-${version}-linux-x86_64.tar.gz"
format = "tar.gz"
strip_components = 1
checksum = { kind = "sha256_url", url = "https://github.com/Kitware/CMake/releases/download/v${version}/cmake-${version}-SHA-256.txt" }

[[install.artifacts]]
platform = { os = "linux", arch = "aarch64" }
url = "https://github.com/Kitware/CMake/releases/download/v${version}/cmake-${version}-linux-aarch64.tar.gz"
format = "tar.gz"
strip_components = 1
checksum = { kind = "sha256_url", url = "https://github.com/Kitware/CMake/releases/download/v${version}/cmake-${version}-SHA-256.txt" }

[[install.artifacts]]
platform = { os = "macos" }
url = "https://github.com/Kitware/CMake/releases/download/v${version}/cmake-${version}-macos-universal.tar.gz"
format = "tar.gz"
strip_components = 1
checksum = { kind = "sha256_url", url = "https://github.com/Kitware/CMake/releases/download/v${version}/cmake-${version}-SHA-256.txt" }

[[install.artifacts]]
platform = { os = "windows", arch = "x86_64" }
url = "https://github.com/Kitware/CMake/releases/download/v${version}/cmake-${version}-windows-x86_64.zip"
format = "zip"
strip_components = 1
checksum = { kind = "sha256_url", url = "https://github.com/Kitware/CMake/releases/download/v${version}/cmake-${version}-SHA-256.txt" }

[[install.artifacts]]
platform = { os = "windows", arch = "aarch64" }
url = "https://github.com/Kitware/CMake/releases/download/v${version}/cmake-${version}-windows-arm64.zip"
format = "zip"
strip_components = 1
checksum = { kind = "sha256_url", url = "https://github.com/Kitware/CMake/releases/download/v${version}/cmake-${version}-SHA-256.txt" }

[[tasks]]
id = "configure"
kind = "other"
label = "cmake -S . -B build -G Ninja"
command = ["cmake", "-S", ".", "-B", "build", "-G", "Ninja"]

[[tasks]]
id = "build"
kind = "build"
label = "cmake --build build"
command = ["cmake", "--build", "build"]
diagnostics = { kind = "gcc_text" }

[[tasks]]
id = "test"
kind = "test"
label = "ctest --test-dir build"
command = ["ctest", "--test-dir", "build", "--output-on-failure"]
