name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    name: engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults: { run: { working-directory: engine } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: engine }
      - name: Sandbox
        if: runner.os == 'Linux'
        working-directory: .
        # Ubuntu lets only named programs make user namespaces; this names bubblewrap.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile bwrap /usr/bin/bwrap flags=(unconfined) {\n  userns,\n}\n' | sudo tee /etc/apparmor.d/bwrap >/dev/null
          sudo apparmor_parser -r /etc/apparmor.d/bwrap || true
          bwrap --version && bwrap --unshare-user --ro-bind / / true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Fixtures are fresh
        shell: bash
        run: diff <(cargo run -q -p axiom-proto --example fixtures --locked | tr -d '\r') <(tr -d '\r' < ../docs/protocol/fixtures.jsonl)
  supply:
    name: licences and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with: { manifest-path: engine/Cargo.toml }
  app:
    name: app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: engine }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.50.0, cache: true }
      - name: Desktop build packages
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev
      - run: cargo build -p axiom-host --locked --bins --examples
        working-directory: engine
      - run: flutter pub get --enforce-lockfile
        working-directory: app
      - run: dart format --output=none --set-exit-if-changed lib test tool benchmark
        working-directory: app
      - run: flutter analyze --fatal-infos
        working-directory: app
      - run: dart run tool/check_licences.dart
        working-directory: app
      - run: scripts/ci-flutter-test.sh
        shell: bash
      - name: Build
        working-directory: app
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) flutter build macos --release ;;
            Linux) flutter build linux --release ;;
            Windows) flutter build windows --release ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.os }}
          path: |
            app/build/shots
            app/test/failures
          if-no-files-found: ignore
