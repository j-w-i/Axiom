name: axiom_desktop
description: "Axiom desktop shell (Flutter, ADR-0020)"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.14.0

# Widgets layer only: no Material or Cupertino (ADR-0020 §1). Every package here must be MIT,
# BSD or Apache-2.0 (scripts/check_dart_licences.py).
dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  markdown: ^7.3.1
  path_parsing: ^1.1.0
  re_editor: ^0.10.0
  re_highlight: ^0.0.3
  xterm: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# re_editor 0.10.0 with the caret's blink made configurable (third_party/re_editor/PATCHES.md).
dependency_overrides:
  re_editor:
    path: third_party/re_editor

flutter:
  uses-material-design: false
  # IBM's unmodified TTFs (assets/fonts/SOURCE.md; OFL-1.1, ADR-0013).
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Italic.ttf
          style: italic
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-Italic.ttf
          style: italic
