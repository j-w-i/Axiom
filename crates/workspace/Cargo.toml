[package]
name = "axiom-workspace"
description = "Workspace registry and safe, workspace-relative file access for the Axiom daemon."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
axiom-protocol = { path = "../protocol" }
tokio = { workspace = true }
ignore.workspace = true
sha2.workspace = true
thiserror.workspace = true
dunce.workspace = true
notify.workspace = true
serde_json.workspace = true
regex.workspace = true

[target.'cfg(unix)'.dependencies]
# Safe wrappers for a rename that never replaces (`renameat2`/`renamex_np`), a non-blocking open
# and the user id (the trash). Already in the tree through `tempfile`.
rustix = { version = "1.1", features = ["fs", "process"] }

[target.'cfg(not(unix))'.dependencies]
# Temp files for atomic writes; on Unix they are made in a directory opened without following
# symlinks instead (`src/beneath.rs`).
tempfile.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile.workspace = true

[lints]
workspace = true
