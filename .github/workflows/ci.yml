name: CI
on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -q -p axiom-protocol --example export_schema -- --check
      - run: python3 scripts/tasks.py check
      - run: python3 scripts/check_deps.py

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-deny }
      - run: cargo deny check

  editor:
    name: Editor (ubuntu-latest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: editor/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
      - run: pnpm run test

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      QT_VERSION: "6.12.0"
    steps:
      - uses: actions/checkout@v4

      # ---- toolchains
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: editor/pnpm-lock.yaml }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      # ---- Qt with WebEngine (LGPL modules only, ADR-0011)
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.os == 'windows-latest' && 'win64_msvc2022_64' || '' }}
          modules: qtwebengine qtwebchannel qtwebsockets qtpositioning
          cache: true
          # The released aqtinstall (3.3.0) cannot read the Windows 6.12.0 repository layout
          # (qt6_6120_msvc2022_64) and fails with "Failed to locate XML data". The master
          # branch can, and installs qtwebengine from the separate extensions repository.
          # Pin to a released version once one contains the fix (see docs/roadmap/current.md).
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@master"

      # Tests load Qt DLLs from PATH; another Qt6Core earlier on PATH gives
      # 0xC0000139 (entry point not found) at process start. Put our Qt first.
      - name: Windows - Qt DLLs first on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Qt root: $env:QT_ROOT_DIR"
          "$env:QT_ROOT_DIR\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "QT_MODULE_DLL=$env:QT_ROOT_DIR\bin\Qt6Core.dll" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Linux packages (GL, xkbcommon, WebEngine runtime libraries)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libnss3 libnspr4 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxi6 \
            libasound2t64 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libfontconfig1
      - name: Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y
      - name: MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # ---- build the daemon, the test helper and the editor bundle
      - run: cargo build -p axiomd -p emit
      - name: Editor bundle
        working-directory: editor
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # ---- the QML literal guard, then the app
      - run: python3 scripts/check_qml.py
      - name: Configure
        shell: bash
        run: cmake -S apps/desktop -B build/desktop -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build/desktop

      # ---- smoke tests, offscreen. Chromium's sandbox cannot start inside the Linux CI
      # container (no user namespaces / setuid helper), so it is disabled on Linux CI ONLY.
      # The application itself never sets this; developers' runs keep the sandbox.
      # Windows only: pin down where a test executable stops. Each function runs on its own
      # with a 15 s cap, writing QtTest's log to a file (stdout is lost when a process is
      # killed). Never fails the job.
      # Windows: deploy Qt next to the executables (windeployqt) and the newest MSVC runtime
      # from the Visual Studio redist. Loading Qt6WebEngine*.dll only through PATH fails here
      # with 0xC0000139 (missing entry point), because the runner's System32 runtime is older
      # than the one Qt's binaries and our build need.
      - name: Windows - deploy Qt and the VC runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-translations --no-opengl-sw --qmldir apps/desktop/qml build/desktop/axiom.exe
          if ($LASTEXITCODE -ne 0) { Write-Host "windeployqt exit=$LASTEXITCODE" }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $vs = & $vswhere -latest -property installationPath
            $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT" -Directory -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
            if ($crt) {
              Write-Host "VC runtime: $($crt.FullName)"
              Copy-Item "$($crt.FullName)\*.dll" build/desktop/ -Force
              Copy-Item "$($crt.FullName)\*.dll" target/debug/ -Force
            }
          }
          Get-ChildItem build/desktop/*.dll | Select-Object -First 5 Name

      - name: Windows per-function diagnostics
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = 'build/desktop/tst_daemonclient.exe'
          $log = "$env:RUNNER_TEMP/q.log"
          $fx = & $exe -functions 2>&1 | Where-Object { $_ -match '\(\)$' } | ForEach-Object { ($_ -split '\(')[0].Trim() }
          Write-Host "functions: $($fx -join ', ')"
          foreach ($f in @('initTestCase') + $fx) {
            Remove-Item $log -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath $exe -ArgumentList @($f, '-o', "$log,txt") -PassThru -NoNewWindow
            if (-not $p.WaitForExit(15000)) {
              Write-Host "FUNCTION $f : HUNG 15 s (exit would be unknown)"; try { $p.Kill() } catch {}
            } else {
              Write-Host "FUNCTION $f : exit=$($p.ExitCode) (0xC0000139=entry point, 0xC0000005=access violation)"
            }
            if (Test-Path $log) { Get-Content $log | Select-Object -Last 6 }
          }

      - name: Test (Linux)
        if: runner.os == 'Linux'
        env:
          QTWEBENGINE_DISABLE_SANDBOX: "1"
          AXIOM_SCREENSHOT_DIR: ${{ github.workspace }}/build/screenshots
        run: ctest --test-dir build/desktop --output-on-failure --stop-on-failure --timeout 45
      - name: Test (macOS, Windows)
        if: runner.os != 'Linux'
        env:
          AXIOM_SCREENSHOT_DIR: ${{ github.workspace }}/build/screenshots
        shell: bash
        run: ctest --test-dir build/desktop --output-on-failure --stop-on-failure --timeout 45

      - name: Upload logs and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            build/desktop/Testing/Temporary/LastTest.log
            build/screenshots/
          if-no-files-found: ignore
